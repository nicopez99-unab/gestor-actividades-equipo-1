<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Actividades Académicas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Gestor de Actividades Académicas</h1>
  </header>
  <nav class="menu-principal">
    <ul>
      <li><a href="#">Inicio</a></li>
      <li><a href="#">Nueva Actividad</a></li>
      <li><a href="#">Ver Lista</a></li>
    </ul>
  </nav>

  <main class="container">
    <section class="card">
      <h2>Registrar Actividad</h2>
      <form id="form-actividad">
        <label for="nombre">Nombre de la actividad:</label>
        <input type="text" id="nombre" name="nombre">

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" name="descripcion" rows="3"></textarea>

        <label for="responsable">Responsable:</label>

        <!-- Conflicto opcional en este select o en el header -->
        <input type="text" id="responsable" name="responsable">

        <label for="prioridad">Prioridad:</label>
        <select id="prioridad" name="prioridad">
          <option value="Baja">Baja</option>
          <option value="Media">Media</option>
          <option value="Alta">Alta</option>
        </select>

        <button type="submit">Guardar Actividad</button>
      </form>
    </section>

    <section class="card">
      <h2>Lista de Actividades</h2>
      <div id="lista-actividades" class="grid-actividades"></div>
    </section>
  </main>
  <script src="app.js"></script>

<section id="registro-actividades">
  <h2>Nueva Actividad Académica</h2>
  
  <form id="formulario-registro">
    
    <div>
      <label for="nombre-actividad">Nombre de la Actividad (Obligatorio):</label>
      <input type="text" id="nombre-actividad" name="nombre" required>
    </div>
    
    <div>
      <label for="desc-actividad">Descripción:</label>
      <textarea id="desc-actividad" name="descripcion" rows="3"></textarea>
    </div>
    
    <div>
      <label for="responsable">Responsable (Obligatorio):</label>
      <input type="text" id="responsable" name="responsable" required>
    </div>

    <div>
      <label for="prioridad">Prioridad:</label>
      <select id="prioridad" name="prioridad">
        <option value="alta">Alta</option>
        <option value="media">Media</option>
        <option value="baja">Baja</option>
      </select>
    </div>

    <div>
      <label for="estado">Estado Inicial:</label>
      <select id="estado" name="estado">
        <option value="pendiente">Pendiente</option>
        <option value="en-proceso">En Proceso</option>
      </select>
    </div>

    <button type="submit">Registrar Actividad</button>
    <p id="mensaje-error" style="color: red; display: none;">Faltan campos obligatorios por llenar.</p>

  </form>
</section>
  
  
</body>
</html>
